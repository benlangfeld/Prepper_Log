services:
  preptrack-sync:
    build:
      context: ./sync-backend
    container_name: preptrack-sync
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DB_PATH: "/data/sync.db"
      TLS_CERT_PATH: "/certs/server.crt"
      TLS_KEY_PATH: "/certs/server.key"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    volumes:
      - preptrack_sync_data:/data
      - ./sync-backend/certs:/certs:ro

volumes:
  preptrack_sync_data:
